<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #81d4fa;
            display: flex;
            padding: 50px;
            margin: 0;
            justify-content: center;
            align-items: center;
        }

        .buttonContainer {
            background-color: #b3e5fc;
            width: 400px;
            height: 400px;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            border: none;
            border-radius: 20px;
        }

        .buttonContainer h1 {
            background-color: white;
            border: 2px solid black;
            border-radius: 20px;
            padding: 15px 70px;
            text-align: center;
            font-size: 50px;
            border: none;
            margin-bottom: 10px;
        }

        .buttonContainer label {
            background-color: aliceblue;
            border: 2px solid black;
            border-radius: 15px;
            padding: 15px;
            border: none;
            margin-bottom: 10px;
        }

        .buttonContainer label input:hover {
            background-color: skyblue;
        }

        button {
            font-weight: 700;
            font-size: 15px;
            background-color: skyblue;
            border: 1px solid black;
            border-radius: 10px;
            border: none;
            padding: 15px 30px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        button:hover {
            background-color: white;
            scale: 1.1;
        }
    </style>

</head>

<body>

    <div class="buttonContainer">
        <h1>My from</h1>
        <label>
            Name:
            <input type="text" name="name" />
        </label>

        <label>
            Password:
            <input type="text" name="password" />
        </label>

        <button>
            Submit
        </button>
    </div>
</body>

</html>
